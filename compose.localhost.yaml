name: keirouter-localhost

# Bundled KeiRouter + Postgres, localhost-only.
# - Tidak ada port yang terekspos ke LAN/internet.
# - Postgres TANPA publish ports -> hanya bisa diakses via network internal `keirouter`.
# - KeiRouter di-publish HANYA ke 127.0.0.1 -> tidak bind ke 0.0.0.0 di host.
# Pakai: docker compose -f compose.localhost.yaml up -d --build

services:
  keirouter:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${KEIROUTER_VERSION:-dev}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    image: ${KEIROUTER_IMAGE:-ghcr.io/mydisha/keirouter:latest}
    restart: unless-stopped
    # Batas RAM container. Bila diisi, app memasang GOMEMLIMIT 80% dari nilai
    # ini sehingga GC bekerja lebih awal. 0 = tanpa batas. Atur lewat .env.
    mem_limit: ${KEIROUTER_MEM_LIMIT:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Kunci 127.0.0.1: format "IP:host_port:container_port" agar Docker
      # hanya listen di loopback host. Jangan ubah ke "20180:20180"
      # (itu bind ke 0.0.0.0 = terekspos ke LAN).
      - "127.0.0.1:${KEIROUTER_PORT:-20180}:20180"
    volumes:
      - keirouter-data:/data
      # Run in the host's timezone so the dashboard clock and "today" match the host.
      - /etc/localtime:/etc/localtime:ro
    environment:
      KEIROUTER_DATA__DIR: /data
      # Ini HOST di DALAM container, wajib tetap 0.0.0.0 agar port-forward
      # dari host bisa masuk. Pembatasan loopback di host diatur oleh
      # `ports: 127.0.0.1:...` di atas + BIND_LOOPBACK_ONLY di bawah.
      KEIROUTER_SERVER__HOST: 0.0.0.0
      KEIROUTER_SERVER__PORT: 20180
      # WAJIB false di Docker: middleware ini cek RemoteAddr TCP yang dilihat
      # server *di dalam* container — via port-publish Docker itu selalu IP
      # gateway (172.x), tidak pernah 127.0.0.1, sehingga `true` memblokir
      # SEMUA request dashboard/API dengan 403. Proteksi loopback sudah
      # dipegang oleh `ports: 127.0.0.1:...` di atas (port tidak bind ke LAN).
      KEIROUTER_SECURITY__BIND_LOOPBACK_ONLY: ${KEIROUTER_BIND_LOOPBACK_ONLY:-false}
      KEIROUTER_SECURITY__ALLOW_PRIVATE_BASE_URL: ${KEIROUTER_SECURITY__ALLOW_PRIVATE_BASE_URL:-false}
      KEIROUTER_SECURITY__TRUST_FORWARDED_HEADERS: ${KEIROUTER_TRUST_FORWARDED_HEADERS:-true}
      KEIROUTER_SECURITY__MASTER_KEY: ${KEIROUTER_MASTER_KEY:-}
      # Google SSO untuk portal publik /portal. Set enabled=true HANYA setelah
      # client id + secret diisi di .env; jika tidak, server menolak start
      # (fail closed).
      KEIROUTER_PORTAL_SSO__ENABLED: ${KEIROUTER_PORTAL_SSO__ENABLED:-false}
      KEIROUTER_PORTAL_SSO__GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      KEIROUTER_PORTAL_SSO__GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # SumoPod payment gateway (portal top-up). Set the ENABLED var to true in
      # .env only after the API key is filled; the server refuses to start if
      # enabled without it. Webhook auth: set either the Svix secret, the token,
      # or both (both set -> both must pass); empty -> webhook 503.
      KEIROUTER_PAYMENT__ENABLED: ${KEIROUTER_PAYMENT__ENABLED:-false}
      KEIROUTER_PAYMENT__BASE_URL: ${KEIROUTER_PAYMENT__BASE_URL:-https://api-pay-sandbox.sumopod.com}
      KEIROUTER_PAYMENT__API_KEY: ${KEIROUTER_PAYMENT__API_KEY:-}
      KEIROUTER_PAYMENT__WEBHOOK_SECRET: ${KEIROUTER_PAYMENT__WEBHOOK_SECRET:-}
      KEIROUTER_PAYMENT__WEBHOOK_TOKEN: ${KEIROUTER_PAYMENT__WEBHOOK_TOKEN:-}
      # Cloudflare Turnstile bot protection for login / portal SSO / top-up.
      # Set ENABLED=true in .env only after both keys are filled; the server
      # refuses to start if enabled without site_key + secret_key.
      KEIROUTER_TURNSTILE__ENABLED: ${KEIROUTER_TURNSTILE__ENABLED:-false}
      KEIROUTER_TURNSTILE__SITE_KEY: ${KEIROUTER_TURNSTILE__SITE_KEY:-}
      KEIROUTER_TURNSTILE__SECRET_KEY: ${KEIROUTER_TURNSTILE__SECRET_KEY:-}
      KEIROUTER_LOG__FORMAT: ${KEIROUTER_LOG_FORMAT:-json}
      # Batas request /v1/* yang boleh berjalan bersamaan, gabungan semua key.
      # Stream memegang slot sampai selesai. Saat penuh, request baru langsung
      # dapat 503 (tidak antre). Atur nilainya lewat .env.
      KEIROUTER_SERVER__MAX_CONCURRENT_REQUESTS: ${KEIROUTER_SERVER__MAX_CONCURRENT_REQUESTS:-100}
      # Ukuran body request maksimal dalam byte (default 128 MiB). Samakan
      # dengan request_body max_size di Caddyfile.
      KEIROUTER_SERVER__MAX_REQUEST_BODY_BYTES: ${KEIROUTER_SERVER__MAX_REQUEST_BODY_BYTES:-134217728}
      # Background account/model health probes send real billed requests to each
      # provider every 30s by default. Default off in this compose; set true to
      # re-enable.
      KEIROUTER_HEALTH__ENABLED: ${KEIROUTER_HEALTH__ENABLED:-false}
      KEIROUTER_DATABASE__DRIVER: postgres
      KEIROUTER_DATABASE__DSN: "postgres://keirouter:${POSTGRES_PASSWORD:-keirouter}@postgres:5432/keirouter?sslmode=disable"
      # Budget spend dibaca dari tabel ringkasan harian (usage_spend_daily).
      # Set false untuk kembali menjumlahkan usage_records langsung.
      KEIROUTER_DATABASE__SPEND_ROLLUP: ${KEIROUTER_DATABASE__SPEND_ROLLUP:-true}
      # Penghitung budget di Redis: cek budget per request membaca Redis,
      # bukan SUM ke Postgres. Rate limit tetap ikut limits.enabled (default
      # off). Set KEIROUTER_LIMITS__BACKEND=memory untuk mematikan.
      KEIROUTER_LIMITS__BACKEND: ${KEIROUTER_LIMITS__BACKEND:-redis}
      KEIROUTER_LIMITS__REDIS_URL: ${KEIROUTER_LIMITS__REDIS_URL:-redis://redis:6379/0}

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # SENGAJA tidak ada `ports:`. Isinya hanya cache penghitung yang selalu
    # bisa dihitung ulang dari Postgres, jadi tanpa persistence. Saat memori
    # penuh, key ber-TTL (penghitung) dibuang dan dihitung ulang dari DB.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # SENGAJA tidak ada `ports:` -> tidak terekspos ke host/LAN sama sekali.
    # Default Postgres hanya 128MB shared_buffers. Sesuaikan lewat .env
    # dengan RAM host (umumnya ~15-25% RAM).
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
    shm_size: 256mb
    environment:
      POSTGRES_USER: keirouter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keirouter}
      POSTGRES_DB: keirouter
    volumes:
      - keirouter-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keirouter -d keirouter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keirouter-data:
  keirouter-pg:
